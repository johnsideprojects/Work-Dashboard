        :root {

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Barlow', sans-serif; background-color: var(--bg-off-white); color: var(--text-dark); line-height: 1.5; overflow: hidden; }

        .staff-selector { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: 6px; }

        .settings-trigger { cursor: pointer; display: flex; align-items: center; color: var(--brand-gray); transition: color 0.2s; }

        .section-label:first-child { margin-top: 0; }

        .modifier-sidebar { background: white; border-left: 1px solid #ddd; padding: 24px; display: flex; flex-direction: column; overflow-y: auto; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .price-input { padding-left: 25px !important; }
        .modifier-sidebar input[type="text"], .modifier-sidebar input[type="email"] { width: 100%; padding: 11px 12px; border: 2px solid #eee; background: #fafafa; border-radius: 6px; font-family: 'Barlow'; font-size: 0.95rem; outline: none; transition: border-color 0.15s, background 0.15s; }
        .modifier-sidebar input[type="text"]:focus, .modifier-sidebar input[type="email"]:focus { border-color: var(--brand-yellow); background: white; }
        .modifier-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin: 18px 0 10px 0; letter-spacing: 0.5px; border-bottom: 1px solid #eee; padding-bottom: 5px; text-transform: uppercase; }
        .modifier-label:first-child { margin-top: 0; }
        .action-stack { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
        .btn-main { padding: 14px 16px; border-radius: 6px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: 'Barlow'; transition: all 0.2s; text-align: center; text-decoration: none; display: block; width: 100%; }
        .btn-copy { background: #eee; color: var(--text-dark); }

        .btn-copy.success { background: #2ecc71; color: white; }
        .btn-send { background: var(--brand-blue); color: white; }
        .btn-send:hover { background: #0056cc; }
        .edit-template-link { text-align: center; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; font-weight: 700; display: none; padding: 4px 0; }
        .edit-template-link:hover { color: var(--brand-blue); }

    </style>
</head>

            { id: "tmpl8",  category: "Operations", title: "Move-Out Confirmation",

            // ── MAINTENANCE ────────────────────────────────────────
            { id: "tmpl9",  category: "Maintenance", title: "Unit Access Needed",

            // ── ADMIN ──────────────────────────────────────────────
            { id: "tmpl11", category: "Admin", title: "Google Review Request",
              imageUrl: "", subject: "How Was Your Experience at AA Self Storage?",
              body: "Hi [NAME],\n\nThank you for choosing AA Self Storage — it\'s been a pleasure having you as a customer!\n\nIf you\'ve had a great experience, we\'d really appreciate it if you could take a moment to leave us a Google review. It only takes a minute and makes a huge difference for a small local business like ours.\n\n👉 [PASTE YOUR GOOGLE REVIEW LINK HERE]\n\nThank you so much — we truly appreciate your support!\n\nWarm regards,\n[STAFF]\nAA Self Storage | Leland, NC" },

            { id: "tmpl12", category: "Admin", title: "Insurance Update Required",
              imageUrl: "", subject: "Action Required: Proof of Insurance Needed",
              body: "Hi [NAME],\n\nOur records show that the proof of insurance on file for your unit [UNIT] has expired or is missing.\n\nPer the terms of your rental agreement, all tenants are required to maintain valid insurance coverage for stored items. Please provide updated proof of insurance at your earliest convenience.\n\nAlternatively, we offer an affordable protection plan for $[PRICE]/month that you can enroll in right through our office — no paperwork required.\n\nPlease respond to this email or stop by the office within the next 7 days to keep your account in good standing.\n\nThank you,\n[STAFF]\nAA Self Storage | Leland, NC" },

            { id: "tmpl13", category: "Admin", title: "Lease Renewal Notice",
              imageUrl: "", subject: "Your Storage Lease — Renewal Information",
              body: "Hi [NAME],\n\nWe wanted to reach out regarding your rental of unit [UNIT] at AA Self Storage.\n\nYour current rate of $[PRICE]/month will remain in effect for the upcoming period. No action is required on your part — your month-to-month agreement will continue automatically.\n\nIf you have any questions about your account, changes in storage needs, or would like to discuss your options, we\'re always happy to help.\n\nThank you for being a valued customer!\n\n[STAFF]\nAA Self Storage | Leland, NC" }
        ];

        let staffData          = DEFAULT_STAFF;
        let activeStaffIdx     = Number(localStorage.getItem('activeStaffIdx') || 0);
        let selectedAvatarUrl  = staffData[0].avatar;
        let templates          = [];
        let selectedTemplateId = null;

        // ── INIT ──────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            listenStaff();
            listenTemplates();
        });

        // ── LISTENERS ─────────────────────────────────────────────
        function listenStaff() {
            onSnapshot(collection(db, 'staff'), snap => {
                if (snap.empty) {
                    const batch = writeBatch(db);
                    DEFAULT_STAFF.forEach(s => batch.set(doc(db, 'staff', s.id), s));
                    batch.commit();
                    return;
                }
                staffData = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => a.id.localeCompare(b.id));
                if (activeStaffIdx > staffData.length - 1) activeStaffIdx = 0;
                renderStaffSelectors();
                renderAvatarOptions();
                syncDraft();
            });
        }

        function listenTemplates() {
            onSnapshot(collection(db, 'templates'), snap => {
                if (snap.empty) {
                    const batch = writeBatch(db);
                    DEFAULT_TEMPLATES.forEach(t => batch.set(doc(db, 'templates', t.id), t));
                    batch.commit();
                    return;
                }
                templates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTemplates();
            });
        }

        // ── STAFF ─────────────────────────────────────────────────
        function renderStaffSelectors() {
            document.getElementById('header-staff-selector').innerHTML = staffData.map((s, idx) => `
                <button class="staff-chip ${idx === activeStaffIdx ? 'active' : ''}" onclick="setActiveStaff(${idx})">
                    <img src="${s.avatar}" class="avatar-small"> ${s.name}
                </button>`).join('');
        }
        window.setActiveStaff = idx => { activeStaffIdx = idx; localStorage.setItem('activeStaffIdx', String(idx)); renderStaffSelectors(); syncDraft(); };

        function renderAvatarOptions() {
            document.getElementById('avatar-options').innerHTML = AVATARS.map(url => `
                <img src="${url}" class="avatar-opt ${url === selectedAvatarUrl ? 'selected' : ''}" onclick="selectAvatar('${url}')">`).join('');
        }
        window.selectAvatar = url => { selectedAvatarUrl = url; renderAvatarOptions(); };

        window.saveStaffSettings = async () => {
            const idx   = parseInt(document.getElementById('edit-staff-target').value);
            const staff = staffData[idx];
            await setDoc(doc(db, 'staff', staff.id), {
                ...staff,
                name:   document.getElementById('edit-name').value,
                avatar: selectedAvatarUrl
            });
            toggleModal('settings-modal', false);
        };

        // ── TEMPLATES ─────────────────────────────────────────────
        function renderTemplates() {
            const container  = document.getElementById('template-list-container');
            const categories = ["Sales", "Operations", "Maintenance", "Admin"];
            container.innerHTML = categories.map(cat => {
                const catT = templates.filter(t => t.category === cat);
                if (!catT.length) return '';
                return `<div class="section-label">${cat}</div>` +
                    catT.map(t => `<button class="template-btn ${t.id === selectedTemplateId ? 'active' : ''}" onclick="selectTemplate('${t.id}')">${t.title}</button>`).join('');
            }).join('');
            document.getElementById('edit-cur-link').style.display = selectedTemplateId ? 'block' : 'none';
        }

        window.selectTemplate = id => { selectedTemplateId = id; renderTemplates(); syncDraft(); };

        window.openTemplateEditor = (id = null) => {
            if (id) {
                const t = templates.find(x => x.id === id);
                document.getElementById('temp-modal-title').innerText = "Edit Template";
                document.getElementById('edit-temp-id').value  = t.id;
                document.getElementById('temp-category').value = t.category || "Sales";
                document.getElementById('temp-title').value    = t.title;
                document.getElementById('temp-image').value    = t.imageUrl || "";
                document.getElementById('temp-subject').value  = t.subject;
                document.getElementById('temp-body').value     = t.body;
                document.getElementById('delete-temp-btn').style.display = "block";
            } else {
                document.getElementById('temp-modal-title').innerText = "Add Template";
                document.getElementById('edit-temp-id').value  = "";
                document.getElementById('temp-category').value = "Sales";
                document.getElementById('temp-title').value    = "";
                document.getElementById('temp-image').value    = "";
                document.getElementById('temp-subject').value  = "";
                document.getElementById('temp-body').value     = "";
                document.getElementById('delete-temp-btn').style.display = "none";
            }
            toggleModal('template-modal', true);
        };

        window.saveTemplate = async () => {
            const id = document.getElementById('edit-temp-id').value;
            const newT = {
                category: document.getElementById('temp-category').value,
                title:    document.getElementById('temp-title').value,
                imageUrl: document.getElementById('temp-image').value,
                subject:  document.getElementById('temp-subject').value,
                body:     document.getElementById('temp-body').value
            };
            if (id) {
                await setDoc(doc(db, 'templates', id), { id, ...newT });
            } else {
                const ref = await addDoc(collection(db, 'templates'), newT);
                selectedTemplateId = ref.id;
            }
            toggleModal('template-modal', false);
        };

        window.deleteTemplate = async () => {
            if (confirm("Delete this template permanently?")) {
                const id = document.getElementById('edit-temp-id').value;
                await deleteDoc(doc(db, 'templates', id));
                selectedTemplateId = null;
                document.getElementById('email-editor').innerHTML = "Select a template to begin...";
                toggleModal('template-modal', false);
            }
        };

        window.editCurrentTemplate = () => { if (selectedTemplateId) openTemplateEditor(selectedTemplateId); };

        // ── DRAFT SYNC ────────────────────────────────────────────
        window.syncDraft = () => {
            if (!selectedTemplateId) return;
            const t = templates.find(x => x.id === selectedTemplateId);
            if (!t) return;
            const name    = document.getElementById('v-name').value  || "[Customer Name]";
            const unit    = document.getElementById('v-unit').value  || "[Unit Type]";
            const price   = document.getElementById('v-price').value || "0.00";
            const staff   = staffData[activeStaffIdx]?.name || "";
            const imgHtml = t.imageUrl ? `<img src="${t.imageUrl}" alt="Email Graphic">` : "";
            document.getElementById('email-editor').innerHTML = t.body
                .replace(/\[IMAGE\]/g, imgHtml).replace(/\[NAME\]/g, name)
                .replace(/\[UNIT\]/g, unit).replace(/\[PRICE\]/g, price)
                .replace(/\[STAFF\]/g, staff);
        };

        // ── COPY / SEND ───────────────────────────────────────────
        window.copyToClipboard = () => {
            const editor = document.getElementById('email-editor');
            const range  = document.createRange();
            range.selectNode(editor);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                if (document.execCommand('copy')) {
                    const btn = document.getElementById('copy-btn');
                    btn.innerText = "Copied!"; btn.classList.add('success');
                    setTimeout(() => { btn.innerText = "Copy to Clipboard"; btn.classList.remove('success'); }, 2000);
                }
            } catch(e) { console.error('Copy failed', e); }
            window.getSelection().removeAllRanges();
        };

        window.sendDirect = () => {
            const t = templates.find(x => x.id === selectedTemplateId);
            if (!t) return;
            window.open(`mailto:${document.getElementById('v-email').value}?subject=${encodeURIComponent(t.subject)}&body=${encodeURIComponent(document.getElementById('email-editor').innerText)}`, '_blank');
        };

        // ── MODALS ────────────────────────────────────────────────
        window.toggleModal = (id, show) => { document.getElementById(id).style.display = show ? 'flex' : 'none'; };

        window.loadStaffDataForEdit = () => {
            const s = staffData[document.getElementById('edit-staff-target').value];
            document.getElementById('edit-name').value = s.name;
            selectedAvatarUrl = s.avatar;
            renderAvatarOptions();
        };
    </script>
</body>
</html>
