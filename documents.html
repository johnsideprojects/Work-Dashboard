<!DOCTYPE html>
<html lang="en" style="scroll-padding-top: 76px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-off-white: #F9F6ED;
            --brand-gray: #7a7a7a;
            --brand-yellow: #ffd701;
            --text-dark: #363636;
            --link-blue: #026af2;
            --white: #ffffff;
            --header-height: 76px;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* --- STICKY HEADER --- */
        header {
            height: var(--header-height);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%; /* Slightly reduced padding to give logo room */
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .logo-container img {
            max-height: 55px; /* Scaled to fit comfortably in the 76px header */
            width: auto;
            display: block;
        }

        nav { display: flex; gap: 30px; }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
            transition: color 0.2s ease;
            padding-bottom: 5px;
        }

        nav a:hover, nav a.active {
            color: var(--link-blue);
            border-bottom: 3px solid var(--brand-yellow);
        }

        /* --- HERO & CONTENT --- */
        .hero {
            background-color: var(--brand-gray);
            color: var(--white);
            padding: 80px 6% 120px 6%;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: -60px auto 60px auto;
            padding: 0 20px;
        }

        .main-card {
            background: var(--white);
            border-radius: 4px;
            padding: 50px;
            box-shadow: var(--shadow);
            min-height: 400px;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.85rem;
            color: var(--brand-gray);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="aa-self-storage-logo-3c.webp" alt="AA Self Storage Logo">
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html" class="active">Documents</a>
            <a href="emails.html">Emails</a>
            <a href="misc.html">Misc</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Documents</h1>
        <p>Operational Overview for Leland Branch</p>
    </section>

    <main class="content-wrapper">
        <div class="main-card">
            <h2>Welcome</h2>
            <hr style="border: 0; border-top: 4px solid var(--brand-yellow); width: 60px; margin: 20px 0;">
            <p>Select a department from the navigation to begin.</p>
        </div>
    </main>

    <footer>
        &copy; 2026 Office Local Dashboard
    </footer>

</body>
</html>
