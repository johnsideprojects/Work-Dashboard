<!DOCTYPE html>
<html lang="en" style="scroll-padding-top: 76px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplies | AA Self Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-off-white: #F4F1E8; 
            --brand-gray: #7a7a7a;
            --brand-yellow: #ffd701; 
            --brand-red: #e74c3c;    
            --brand-blue: #026af2;   
            --text-dark: #363636;
            --white: #ffffff;
            --header-height: 76px;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: 'Barlow', sans-serif; 
            background-color: var(--bg-off-white); 
            color: var(--text-dark); 
        }

        /* --- HEADER --- */
        header { 
            height: var(--header-height); 
            background: var(--white); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 4%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 4px solid var(--brand-yellow); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        .logo-container img { max-height: 55px; width: auto; display: block; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        nav { display: flex; gap: 25px; align-items: center; }
        nav a { text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
        
        .staff-selector { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: 6px; }
        .staff-chip { 
            display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; 
            font-size: 0.7rem; font-weight: 700; cursor: pointer; border: none; background: transparent; color: var(--brand-gray);
            text-transform: uppercase;
        }
        .staff-chip.active { background: var(--brand-yellow); color: var(--text-dark); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .avatar-small { width: 20px; height: 20px; border-radius: 50%; background: #ddd; object-fit: cover; }

        /* --- LAYOUT --- */
        .manager-grid {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 30px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 4%;
        }

        .widget {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }
        .widget-header {
            padding: 20px 25px;
            background: #fdfdfd;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .widget-title { font-weight: 700; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }

        .scroll-area { padding: 20px; overflow-y: auto; flex-grow: 1; }
        
        /* --- ITEMS --- */
        .supply-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.2s;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .supply-item:hover { border-color: var(--brand-yellow); background: #fff; }
        
        .item-info { flex-grow: 1; }
        .item-name { font-weight: 700; font-size: 1rem; display: block; }
        .item-meta { font-size: 0.65rem; color: #aaa; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }

        .btn-action {
            background: none; border: none; cursor: pointer; padding: 8px; color: #ccc; transition: 0.2s; display: flex; align-items: center;
        }
        .btn-action:hover { color: var(--brand-blue); }
        .btn-delete:hover { color: var(--brand-red) !important; }

        /* --- EMPTY STATE --- */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        .empty-state svg { margin-bottom: 15px; opacity: 0.3; }
        .empty-state p { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0; }

        /* --- SHOPPING LIST SPECIFICS --- */
        .shopping-panel { border-left: 6px solid var(--brand-blue); }
        .shopping-item { background: #fff; border-color: #d0e4ff; }
        
        .section-divider {
            font-size: 0.65rem; font-weight: 800; color: #bbb; text-transform: uppercase;
            margin: 25px 0 12px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;
            display: flex; align-items: center; gap: 10px;
        }

        .action-bar {
            padding: 20px; background: #f9f9f9; border-top: 1px solid #eee; display: flex; gap: 10px;
        }
        .input-main {
            flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; outline: none;
        }
        .btn-add {
            background: var(--brand-blue); color: white; border: none; padding: 0 20px; 
            border-radius: 6px; font-weight: 700; text-transform: uppercase; cursor: pointer;
        }
        .btn-print {
            background: var(--text-dark); color: white; border: none; padding: 14px;
            border-radius: 6px; font-weight: 700; text-transform: uppercase; cursor: pointer;
            margin: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s;
        }
        .btn-print:hover { background: #000; }

        /* --- PRINT STYLES --- */
        @media print {
            header, .inventory-panel, .action-bar, .btn-action, .btn-print, .section-divider, #completed-list, .no-print { 
                display: none !important; 
            }
            body { background: white; }
            .manager-grid { display: block; margin: 0; padding: 0; }
            .widget { box-shadow: none; border: none; height: auto; width: 100%; }
            .widget-header { border-bottom: 2px solid black; padding: 10px 0; }
            .widget-title::after { content: " - Printed Shopping List"; }
            .supply-item { 
                border: none; border-bottom: 1px solid #eee; border-radius: 0; 
                padding: 15px 0; background: white !important; 
            }
            .item-name { font-size: 1.2rem; }
            .item-name::before { content: "☐ "; font-family: sans-serif; margin-right: 10px; }
            .shopping-panel { border: none !important; width: 100% !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html"><img src="aa-self-storage-logo-3c.webp" alt="AA Self Storage"></a>
        </div>
        <div class="nav-right">
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="#" style="color: var(--brand-blue); border-bottom: 2px solid var(--brand-blue);">Supplies</a>
            </nav>
            <div class="staff-selector" id="header-staff-selector"></div>
        </div>
    </header>

    <main class="manager-grid">
        <section class="widget inventory-panel">
            <div class="widget-header">
                <span class="widget-title">Routine Items (Catalog)</span>
                <span style="font-size: 0.65rem; color: #aaa; font-weight: 700; text-transform: uppercase;">Click item to Request</span>
            </div>
            <div class="scroll-area" id="catalog-list">
                </div>
            <div class="action-bar">
                <input type="text" id="catalog-input" class="input-main" placeholder="Create new routine item...">
                <button class="btn-add" onclick="createNewCatalogItem()">Add</button>
            </div>
        </section>

        <section class="widget shopping-panel">
            <div class="widget-header">
                <span class="widget-title">Active Shopping List</span>
                <div id="item-count" style="font-size: 0.7rem; font-weight: 700; background: var(--brand-blue); color: white; padding: 2px 8px; border-radius: 10px;">0</div>
            </div>
            <div class="scroll-area">
                <div id="active-list">
                    </div>
                
                <div id="done-section" style="display:none;">
                    <div class="section-divider">Just Purchased</div>
                    <div id="completed-list">
                        </div>
                </div>
            </div>
            
            <button class="btn-print" onclick="window.print()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Print Shopping List
            </button>
        </section>
    </main>

    <script>
        let catalog = JSON.parse(localStorage.getItem('ss_catalog_v2')) || [
            { id: 1, name: "Disc Locks (10pk)", cat: "Retail" },
            { id: 2, name: "Moisture Absorbents", cat: "Retail" },
            { id: 3, name: "Toilet Paper (Case)", cat: "Facility" },
            { id: 4, name: "HVAC Filters 20x20", cat: "Maintenance" }
        ];

        let shoppingList = JSON.parse(localStorage.getItem('ss_shopping_v2')) || [];

        function init() {
            renderCatalog();
            renderShopping();
            renderStaff();
        }

        // --- RENDERING ---
        function renderCatalog() {
            const container = document.getElementById('catalog-list');
            const available = catalog.filter(catItem => !shoppingList.some(shopItem => shopItem.name === catItem.name));
            
            container.innerHTML = available.map(item => `
                <div class="supply-item" onclick="requestItem(${item.id})">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-meta">${item.cat}</span>
                    </div>
                    <div class="btn-action">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </div>
                </div>
            `).join('') || '<div style="color:#aaa; font-size:0.85rem; text-align:center; margin-top:20px;">All routine items are currently requested.</div>';
            save();
        }

        function renderShopping() {
            const activeCont = document.getElementById('active-list');
            const doneCont = document.getElementById('completed-list');
            const doneSection = document.getElementById('done-section');

            const activeItems = shoppingList.filter(i => !i.bought);
            const doneItems = shoppingList.filter(i => i.bought);

            document.getElementById('item-count').innerText = activeItems.length;

            if (activeItems.length === 0) {
                activeCont.innerHTML = `
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <p>No items needed</p>
                    </div>`;
            } else {
                activeCont.innerHTML = activeItems.map(item => `
                    <div class="supply-item shopping-item">
                        <div class="item-info" onclick="buyItem(${item.id})">
                            <span class="item-name">${item.name}</span>
                            <span class="item-meta no-print">Requested by ${item.by}</span>
                        </div>
                        <button class="btn-action btn-delete" onclick="removeFromList(${item.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                `).join('');
            }

            doneCont.innerHTML = doneItems.map(item => `
                <div class="supply-item" style="opacity:0.6; background:#eee;" onclick="unbuyItem(${item.id})">
                    <div class="item-info">
                        <span class="item-name" style="text-decoration:line-through;">${item.name}</span>
                        <span class="item-meta">Purchased</span>
                    </div>
                    <div class="btn-action" style="color:var(--brand-blue)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
            `).join('');

            doneSection.style.display = doneItems.length > 0 ? 'block' : 'none';
            save();
        }

        // --- CORE ACTIONS ---
        function requestItem(catId) {
            const item = catalog.find(i => i.id === catId);
            if(!item) return;

            shoppingList.push({
                id: Date.now(),
                name: item.name,
                bought: false,
                by: activeStaff
            });

            renderCatalog();
            renderShopping();
        }

        function buyItem(id) {
            const item = shoppingList.find(i => i.id === id);
            if(item) item.bought = true;
            renderShopping();
        }

        function unbuyItem(id) {
            const item = shoppingList.find(i => i.id === id);
            if(item) item.bought = false;
            renderShopping();
        }

        function removeFromList(id) {
            shoppingList = shoppingList.filter(i => i.id !== id);
            renderCatalog();
            renderShopping();
        }

        function createNewCatalogItem() {
            const input = document.getElementById('catalog-input');
            if(!input.value) return;
            catalog.push({ id: Date.now(), name: input.value, cat: "General" });
            input.value = "";
            renderCatalog();
        }

        function save() {
            localStorage.setItem('ss_catalog_v2', JSON.stringify(catalog));
            localStorage.setItem('ss_shopping_v2', JSON.stringify(shoppingList));
        }

        // --- STAFF LOGIC ---
        let activeStaff = "Staff A";
        function renderStaff() {
            const staff = ["Staff A", "Staff B", "Maint"];
            const container = document.getElementById('header-staff-selector');
            container.innerHTML = staff.map(s => `
                <button class="staff-chip ${s === activeStaff ? 'active' : ''}" onclick="setStaff('${s}')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${s}" class="avatar-small">
                    ${s}
                </button>
            `).join('');
        }
        function setStaff(s) { activeStaff = s; renderStaff(); }

        init();
    </script>
</body>
</html>
