<!DOCTYPE html>
<html lang="en" style="scroll-padding-top: 76px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List | AA Self Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-off-white: #F4F1E8; 
            --brand-gray: #555555;
            --brand-yellow: #ffd701; 
            --brand-red: #e74c3c;    
            --brand-blue: #026af2;   
            --text-dark: #363636;
            --text-muted: #666666;
            --text-subtle: #888888;
            --white: #ffffff;
            --header-height: 76px;
            --sidenav-width: 200px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Barlow', sans-serif; background-color: var(--bg-off-white); color: var(--text-dark); line-height: 1.5; overflow-x: hidden; }
        .sidenav { position: fixed; top: 0; left: 0; width: var(--sidenav-width); height: 100vh; background: var(--white); border-right: 1px solid rgba(0,0,0,0.08); box-shadow: 2px 0 12px rgba(0,0,0,0.05); display: flex; flex-direction: column; z-index: 1100; }
        .sidenav-logo { height: var(--header-height); display: flex; align-items: center; justify-content: center; padding: 0 16px; border-bottom: 4px solid var(--brand-yellow); flex-shrink: 0; }
        .sidenav-logo img { max-height: 46px; max-width: 100%; width: auto; display: block; }
        .sidenav-links { padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .sidenav-section-label { font-size: 0.65rem; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 1px; padding: 0 8px; margin-bottom: 6px; margin-top: 4px; }
        .sidenav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; text-decoration: none; color: var(--text-muted); font-weight: 700; font-size: 0.85rem; transition: background 0.15s, color 0.15s; }
        .sidenav-link:hover { background: #f5f5f5; color: var(--text-dark); }
        .sidenav-link.active { background: #fff8d6; color: var(--text-dark); }
        .sidenav-link > svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.65; }
        .sidenav-link.active svg { opacity: 1; }
        header { height: var(--header-height); background: var(--white); display: flex; align-items: center; justify-content: flex-end; padding: 0 24px; position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid var(--brand-yellow); box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .staff-selector { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: 6px; }
        .staff-chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; border: none; background: transparent; color: var(--brand-gray); }
        .staff-chip.active { background: var(--brand-yellow); color: var(--text-dark); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .avatar-small { width: 20px; height: 20px; border-radius: 50%; background: #ddd; object-fit: cover; }
        .page-body { margin-left: var(--sidenav-width); }
        .manager-grid { display: grid; grid-template-columns: 1fr 420px; gap: 20px; max-width: 1400px; margin: 20px auto; padding: 0 20px; height: calc(100vh - 116px); }
        .widget { background: var(--white); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; overflow: hidden; }
        .widget-header { font-weight: 700; text-transform: uppercase; font-size: 0.85rem; color: var(--brand-gray); border-bottom: 3px solid var(--brand-yellow); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: var(--white); }
        .widget-hint { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: none; }
        .scroll-area { padding: 16px 20px; overflow-y: auto; flex-grow: 1; }
        .supply-item { display: flex; align-items: center; padding: 13px 16px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; transition: border-color 0.15s, box-shadow 0.15s; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .supply-item:hover { border-color: var(--brand-yellow); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .item-info { flex-grow: 1; }
        .item-name { font-weight: 700; font-size: 0.95rem; display: block; color: var(--text-dark); }
        .item-cat-badge { display: inline-block; margin-top: 3px; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eee; color: var(--text-muted); }
        .cat-Retail { background: #e6f1fb; color: #185FA5; }
        .cat-Facility { background: #e1f5ee; color: #0F6E56; }
        .cat-Maintenance { background: #faeeda; color: #854F0B; }
        .cat-General { background: #eee; color: var(--text-muted); }
        .btn-request { background: var(--brand-blue); color: white; border: none; padding: 7px 14px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: background 0.15s; white-space: nowrap; flex-shrink: 0; }
        .btn-request:hover { background: #0056cc; }
        .btn-cat-delete { background: none; border: none; cursor: pointer; padding: 6px 8px; color: #ccc; transition: color 0.15s; display: flex; align-items: center; flex-shrink: 0; margin-left: 4px; }
        .btn-cat-delete:hover { color: var(--brand-red); }
        .btn-cat-delete svg { width: 15px; height: 15px; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 50px 20px; color: var(--text-subtle); }
        .empty-state svg { margin-bottom: 14px; opacity: 0.3; }
        .empty-state p { font-size: 0.9rem; font-weight: 700; margin: 0; color: var(--brand-gray); }
        .shopping-panel { border-top: 3px solid var(--brand-blue); }
        .item-count-badge { font-size: 0.75rem; font-weight: 700; background: var(--brand-blue); color: white; padding: 3px 10px; border-radius: 10px; line-height: 1; }
        .shopping-item { border-color: #d0e4ff; background: #f8fbff; }
        .shopping-item:hover { border-color: var(--brand-blue); }
        .section-divider { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin: 20px 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .item-meta-sub { font-size: 0.72rem; color: var(--text-subtle); font-weight: 700; margin-top: 2px; display: block; }
        .btn-action-icon { background: none; border: none; cursor: pointer; padding: 7px; color: #bbb; transition: color 0.15s; display: flex; align-items: center; flex-shrink: 0; }
        .btn-action-icon:hover { color: var(--brand-red); }
        .btn-action-icon svg { width: 16px; height: 16px; }
        .purchased-item { opacity: 0.6; }
        .purchased-item .item-name { text-decoration: line-through; }
        .btn-undo-icon { color: var(--brand-blue) !important; }
        .action-bar { padding: 14px 20px; background: #f9f9f9; border-top: 1px solid #eee; display: flex; gap: 8px; flex-shrink: 0; }
        .input-main { flex-grow: 1; padding: 10px 14px; border: 2px solid #eee; border-radius: 6px; font-family: inherit; font-size: 0.9rem; outline: none; transition: border-color 0.15s; }
        .input-main:focus { border-color: var(--brand-yellow); }
        .select-cat { padding: 10px; border: 2px solid #eee; border-radius: 6px; font-family: inherit; font-size: 0.85rem; font-weight: 700; color: var(--text-dark); background: white; outline: none; cursor: pointer; transition: border-color 0.15s; }
        .select-cat:focus { border-color: var(--brand-yellow); }
        .btn-add { background: var(--brand-blue); color: white; border: none; padding: 0 18px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
        .btn-add:hover { background: #0056cc; }
        .btn-print { margin: 16px 20px; background: var(--text-dark); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; flex-shrink: 0; }
        .btn-print:hover { background: #000; }
        .btn-print svg { width: 16px; height: 16px; }
        @media (max-width: 1100px) {
            .manager-grid { grid-template-columns: 1fr; height: auto; }
            .widget { height: auto; min-height: 400px; }
            .sidenav { position: relative; width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 4px solid var(--brand-yellow); }
            .page-body { margin-left: 0; }
        }
        @media print {
            header, .sidenav, .inventory-panel, .action-bar, .btn-action-icon,
            .btn-request, .btn-cat-delete, .btn-print, .section-divider, #completed-list, .no-print { display: none !important; }
            body { background: white; }
            .page-body { margin-left: 0; }
            .manager-grid { display: block; margin: 0; padding: 0; }
            .widget { box-shadow: none; border: none; height: auto; width: 100%; }
            .widget-header { border-bottom: 2px solid black; padding: 10px 0; }
            .widget-header::after { content: " — Printed Shopping List"; font-weight: 400; }
            .supply-item { border: none; border-bottom: 1px solid #eee; border-radius: 0; padding: 14px 0; background: white !important; box-shadow: none; }
            .item-name { font-size: 1.1rem; }
            .item-name::before { content: "☐  "; font-family: sans-serif; }
            .shopping-panel { border: none !important; width: 100% !important; }
            .item-count-badge { display: none; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #bbb; border-radius: 10px; }
    </style>
</head>
<body>

        <aside class="sidenav">
        <div class="sidenav-logo"><img src="aa-self-storage-logo-3c.webp" alt="AA Self Storage"></div>
        <nav class="sidenav-links">
            <div class="sidenav-section-label">Navigation</div>
            <a href="index.html" class="sidenav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="emails.html" class="sidenav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Email Composer
            </a>
            <a href="supplies.html" class="sidenav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                Shopping List
            </a>
        </nav>
    </aside>

    <div class="page-body">
        <header>
            <div class="nav-right">
                <div class="staff-selector" id="header-staff-selector"></div>
            </div>
        </header>

        <main class="manager-grid">
            <section class="widget inventory-panel">
                <div class="widget-header">
                    Routine Items
                    <span class="widget-hint">Tap item to request</span>
                </div>
                <div class="scroll-area" id="catalog-list"></div>
                <div class="action-bar">
                    <input type="text" id="catalog-input" class="input-main" placeholder="New routine item...">
                    <select id="catalog-cat" class="select-cat">
                        <option value="General">General</option>
                        <option value="Retail">Retail</option>
                        <option value="Facility">Facility</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                    <button class="btn-add" onclick="createNewCatalogItem()">Add Item</button>
                </div>
            </section>

            <section class="widget shopping-panel">
                <div class="widget-header">
                    Shopping List
                    <div class="item-count-badge" id="item-count">0</div>
                </div>
                <div class="scroll-area">
                    <div id="active-list"></div>
                    <div id="done-section" style="display:none;">
                        <div class="section-divider">Just Purchased</div>
                        <div id="completed-list"></div>
                    </div>
                </div>
                <button class="btn-print" onclick="window.print()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    Print Shopping List
                </button>
            </section>
        </main>
    </div>

    <!-- ── FIREBASE ────────────────────────────────────────────── -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, deleteDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────
        const firebaseConfig = {
            apiKey:            "AIzaSyC1w7shhAwtLS0PJSJ67fhNfA67JetO3s4",
            authDomain:        "leland-dashboard.firebaseapp.com",
            projectId:         "leland-dashboard",
            storageBucket:     "leland-dashboard.firebasestorage.app",
            messagingSenderId: "520920211884",
            appId:             "1:520920211884:web:db378402829a898a0c9a09"
        };
        // ─────────────────────────────────────────────────────────

        const app = initializeApp(firebaseConfig);
        const db  = getFirestore(app);

        const AVATARS = [
            // ── Animal Avatars — all confirmed free on flaticon.com ──
            "https://cdn-icons-png.flaticon.com/512/8034/8034504.png", // Penguin    (justicon)
            "https://cdn-icons-png.flaticon.com/512/7063/7063118.png", // Bear       (Flat Icons)
            "https://cdn-icons-png.flaticon.com/512/141/141803.png",   // Fox        (Freepik)
            "https://cdn-icons-png.flaticon.com/512/141/141742.png",   // Koala      (Freepik)
            "https://cdn-icons-png.flaticon.com/512/1959/1959921.png", // Puppy      (justicon)
            "https://cdn-icons-png.flaticon.com/512/1959/1959951.png", // Elephant   (justicon)
            "https://cdn-icons-png.flaticon.com/512/1959/1959984.png", // Red Panda  (justicon)
            "https://cdn-icons-png.flaticon.com/512/2618/2618447.png", // Bunny      (justicon)
            "https://cdn-icons-png.flaticon.com/512/1318/1318921.png", // Giraffe    (justicon)
            "https://cdn-icons-png.flaticon.com/512/8372/8372114.png", // Panda      (free)
            "https://cdn-icons-png.flaticon.com/512/2315/2315502.png", // Wolf       (free)
            "https://cdn-icons-png.flaticon.com/512/1757/1757017.png", // Lion       (free)
            "https://cdn-icons-png.flaticon.com/512/3195/3195978.png", // Monkey     (free)
            "https://cdn-icons-png.flaticon.com/512/103/103323.png",   // Owl        (Freepik)
            "https://cdn-icons-png.flaticon.com/512/4775/4775505.png", // Rabbit     (free)
            "https://cdn-icons-png.flaticon.com/512/578/578423.png",   // Panda Bear (free)
            "https://cdn-icons-png.flaticon.com/512/2173/2173478.png", // Cat        (free)
            "https://cdn-icons-png.flaticon.com/512/1998/1998713.png", // Lion 2     (Flat Icons)
            "https://cdn-icons-png.flaticon.com/512/1998/1998804.png", // Tiger      (Flat Icons)
            "https://cdn-icons-png.flaticon.com/512/7063/7063181.png", // Lion 3     (Flat Icons)
            "https://cdn-icons-png.flaticon.com/512/2053/2053574.png", // Dog        (justicon)
            "https://cdn-icons-png.flaticon.com/512/2053/2053787.png", // Dog 2      (justicon)
            "https://cdn-icons-png.flaticon.com/512/11957/11957797.png", // Tiger 2  (RIkas Dzihab)
            "https://cdn-icons-png.flaticon.com/512/1998/1998592.png", // Cat 2      (Flat Icons)
        ];

        const DEFAULT_STAFF = [
            { id: "staff0", name: "Staff A", avatar: AVATARS[0] },
            { id: "staff1", name: "Staff B", avatar: AVATARS[1] },
            { id: "staff2", name: "Maint",   avatar: AVATARS[2] }
        ];

        const DEFAULT_CATALOG = [
            { id: "cat1", name: "Disc Locks (10pk)",  cat: "Retail" },
            { id: "cat2", name: "Moisture Absorbents", cat: "Retail" },
            { id: "cat3", name: "Toilet Paper (Case)", cat: "Facility" },
            { id: "cat4", name: "HVAC Filters 20x20",  cat: "Maintenance" }
        ];

        let staffData    = DEFAULT_STAFF;
        let activeStaffIdx = Number(localStorage.getItem('activeStaffIdx') || 0);
        let catalog      = [];
        let shoppingList = [];

        // ── INIT ──────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('catalog-input').addEventListener('keypress', e => {
                if (e.key === 'Enter') createNewCatalogItem();
            });
            listenStaff();
            listenCatalog();
            listenShopping();
        });

        // ── LISTENERS ─────────────────────────────────────────────
        function listenStaff() {
            onSnapshot(collection(db, 'staff'), snap => {
                if (snap.empty) {
                    const batch = writeBatch(db);
                    DEFAULT_STAFF.forEach(s => batch.set(doc(db, 'staff', s.id), s));
                    batch.commit();
                    return;
                }
                staffData = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => a.id.localeCompare(b.id));
                if (activeStaffIdx > staffData.length - 1) activeStaffIdx = 0;
                renderStaff();
            });
        }

        function listenCatalog() {
            onSnapshot(collection(db, 'catalog'), snap => {
                if (snap.empty) {
                    const batch = writeBatch(db);
                    DEFAULT_CATALOG.forEach(c => batch.set(doc(db, 'catalog', c.id), c));
                    batch.commit();
                    return;
                }
                catalog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCatalog();
            });
        }

        function listenShopping() {
            onSnapshot(collection(db, 'shoppingList'), snap => {
                shoppingList = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                renderCatalog();
                renderShopping();
            });
        }

        // ── STAFF ─────────────────────────────────────────────────
        function renderStaff() {
            document.getElementById('header-staff-selector').innerHTML = staffData.map((s, idx) => `
                <button class="staff-chip ${idx === activeStaffIdx ? 'active' : ''}" onclick="setStaff(${idx})">
                    <img src="${s.avatar}" class="avatar-small"> ${s.name}
                </button>`).join('');
        }
        window.setStaff = idx => { activeStaffIdx = idx; localStorage.setItem('activeStaffIdx', String(idx)); renderStaff(); };

        // ── CATALOG ───────────────────────────────────────────────
        function renderCatalog() {
            const container = document.getElementById('catalog-list');
            const available = catalog.filter(c => !shoppingList.some(s => s.name === c.name));
            if (available.length === 0) {
                container.innerHTML = `<div class="empty-state">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg><p>All items are currently on the list</p></div>`;
            } else {
                container.innerHTML = available.map(item => `
                    <div class="supply-item">
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cat-badge cat-${item.cat}">${item.cat}</span>
                        </div>
                        <button class="btn-request" onclick="requestItem('${item.id}')">Request</button>
                        <button class="btn-cat-delete" onclick="deleteCatalogItem('${item.id}')" title="Remove from catalog">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        </button>
                    </div>`).join('');
            }
        }

        // ── SHOPPING LIST ─────────────────────────────────────────
        function renderShopping() {
            const activeCont  = document.getElementById('active-list');
            const doneCont    = document.getElementById('completed-list');
            const doneSection = document.getElementById('done-section');
            const activeItems = shoppingList.filter(i => !i.bought);
            const doneItems   = shoppingList.filter(i => i.bought);

            document.getElementById('item-count').textContent = activeItems.length;

            activeCont.innerHTML = activeItems.length === 0
                ? `<div class="empty-state">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg><p>Nothing on the list yet</p></div>`
                : activeItems.map(item => `
                    <div class="supply-item shopping-item">
                        <div class="item-info" onclick="buyItem('${item.id}')" style="cursor:pointer;">
                            <span class="item-name">${item.name}</span>
                            <span class="item-meta-sub no-print">Requested by ${item.by}</span>
                        </div>
                        <button class="btn-action-icon" onclick="removeFromList('${item.id}')" title="Remove from list">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>`).join('');

            doneCont.innerHTML = doneItems.map(item => `
                <div class="supply-item purchased-item" onclick="unbuyItem('${item.id}')" style="cursor:pointer;">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-meta-sub">Tap to mark unpurchased</span>
                    </div>
                    <button class="btn-action-icon btn-undo-icon" title="Mark as unpurchased">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                </div>`).join('');

            doneSection.style.display = doneItems.length > 0 ? 'block' : 'none';
        }

        // ── ACTIONS ───────────────────────────────────────────────
        window.requestItem = async catId => {
            const item = catalog.find(i => i.id === catId);
            if (!item) return;
            await addDoc(collection(db, 'shoppingList'), {
                name: item.name, bought: false,
                by: staffData[activeStaffIdx].name,
                createdAt: Date.now()
            });
        };

        window.buyItem    = async id => { await updateDoc(doc(db, 'shoppingList', id), { bought: true }); };
        window.unbuyItem  = async id => { await updateDoc(doc(db, 'shoppingList', id), { bought: false }); };
        window.removeFromList = async id => { await deleteDoc(doc(db, 'shoppingList', id)); };

        window.createNewCatalogItem = async () => {
            const input = document.getElementById('catalog-input');
            const cat   = document.getElementById('catalog-cat');
            if (!input.value.trim()) return;
            await addDoc(collection(db, 'catalog'), { name: input.value.trim(), cat: cat.value });
            input.value = ''; cat.value = 'General';
        };

        window.deleteCatalogItem = async id => { await deleteDoc(doc(db, 'catalog', id)); };
    </script>
</body>
</html>
